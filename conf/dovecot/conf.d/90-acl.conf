##
## Wallza shared mailbox access using Dovecot IMAP ACLs.
##

# Load the ACL engine for mailbox access checks.
mail_plugins = $mail_plugins acl

# Expose RFC 4314 ACL management commands only through IMAP.
protocol imap {
  mail_plugins = $mail_plugins imap_acl
}

plugin {
  # ACL rules are stored beside the mailbox in dovecot-acl files.
  acl = vfile

  # Shared mailbox discovery dictionary is on the persistent BillionMail
  # /var/vmail volume. Dovecot runs as vmail:mail (UID 150 / GID 8).
  acl_shared_dict = file:/var/vmail/shared-mailboxes.db
}

# BillionMail's SQL userdb resolves each mailbox home to /var/vmail/%d/%n
# and mail_location to maildir:/var/vmail/%d/%n. %% variables identify the
# mailbox being shared; normal % variables identify the authenticated user.
namespace shared {
  type = shared
  separator = /
  prefix = Shared/%%u/
  location = maildir:%%h:INDEXPVT=%h/shared/%%u
  subscriptions = no
  list = children
}
