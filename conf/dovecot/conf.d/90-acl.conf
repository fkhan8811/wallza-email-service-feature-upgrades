##
## Mailbox access control lists and shared mailbox namespace.
##

# Enable Dovecot's internal ACL engine for all mailbox operations.
mail_plugins = $mail_plugins acl

# IMAP clients manage permissions through RFC 4314 ACL commands.
# The imap_acl module is only loaded by the IMAP protocol.
protocol imap {
  mail_plugins = $mail_plugins imap_acl
}

plugin {
  acl = vfile

  # The dictionary must remain on the persistent /var/vmail volume.
  # The dovecot container starts with /var/vmail owned by vmail:mail (150:8),
  # so the IMAP process can update the shared mailbox list.
  acl_shared_dict = file:/var/vmail/shared-mailboxes.db
}

# User mailbox home directories are returned by the SQL userdb query as
# /var/vmail/<domain>/<local-part>; mail_location is maildir:/var/vmail/%d/%n.
# Keep per-user INDEXPVT data inside that same owner's persistent mail home.
namespace shared {
  type = shared
  separator = /
  prefix = Shared/%%u/
  location = maildir:%%h:INDEXPVT=%h/shared/%%u
  subscriptions = no
  list = children
}
